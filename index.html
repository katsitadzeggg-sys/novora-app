<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Novora კონსტრუქტორი</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&family=Noto+Serif+Georgian:wght@500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#E4E6E2;
  --panel:#F7F7F4;
  --ink:#1D2321;
  --muted:#5A635E;
  --line:#CDD1CC;
  --accent:#2C5A4D;
  --accent-ink:#F4F6F2;
  --brass:#A9844A;
  --warn:#9A3B26;
  --stage:#D9DBD6;
  --display:"Noto Serif Georgian", Georgia, serif;
  --body:"Noto Sans Georgian", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:14px;padding:14px clamp(16px,2vw,24px)}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.3em}
.proj{display:flex;flex-direction:column;border-left:1px solid var(--line);padding-left:16px;min-width:0}
.proj b{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34ch}
.proj small{font-size:13px;color:var(--muted)}
.proj small.dirty{color:var(--warn)}
.hdr-actions{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.ghost{min-height:48px;padding:0 18px;border:1px solid var(--line);background:var(--panel);border-radius:999px;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.ghost svg{width:18px;height:18px}
.ghost.solid{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}

main{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,460px);gap:16px;min-height:0}
main.wide{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr)}
.stage{position:relative;background:var(--stage);border-radius:6px;overflow:hidden;min-height:0;touch-action:none}
.stage canvas{display:block;width:100%;height:100%}
.views{position:absolute;left:16px;right:16px;bottom:16px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.views button{pointer-events:auto}
#openBtn{margin-left:auto;background:var(--accent);color:var(--accent-ink)}
#openBtn.on{background:var(--ink)}
.views button{min-height:48px;padding:0 14px;border:0;border-radius:999px;background:rgba(247,247,244,.92);font-size:15px;font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.views button.on{background:var(--ink);color:var(--accent-ink)}
.dims{position:absolute;right:16px;top:16px;background:rgba(247,247,244,.94);padding:10px 14px;border-radius:6px;font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.dims small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);letter-spacing:.04em;margin-bottom:2px}

.panel{background:var(--panel);border-radius:6px;display:flex;flex-direction:column;min-height:0;border:1px solid var(--line);min-width:0}
.steps{display:grid;grid-template-columns:repeat(7,minmax(60px,1fr));overflow-x:auto;border-bottom:1px solid var(--line)}
.steps button{border:0;background:none;padding:10px 2px 8px;line-height:1.15;text-align:center;white-space:nowrap;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--muted);border-bottom:3px solid transparent;min-height:64px}
.steps button b{font-family:var(--mono);font-size:13px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-weight:500}
.steps button{font-size:11.5px}
.steps button.on{color:var(--ink);border-bottom-color:var(--accent)}
.steps button.on b{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steps button.done b{border-color:var(--accent);color:var(--accent)}
.content{flex:1;overflow-y:auto;padding:22px 24px;display:flex;flex-direction:column;gap:24px;min-height:0}
h2{font-family:var(--display);font-weight:700;font-size:26px;margin:0;text-wrap:balance}
.lede{margin:-12px 0 0;color:var(--muted);font-size:15px;line-height:1.5}
.group{display:flex;flex-direction:column;gap:10px}
.label{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.note{font-size:13px;color:var(--muted);line-height:1.45;margin:0}

.field{display:flex;flex-direction:column;gap:6px}
.field input,.field textarea{font:inherit;font-size:18px;padding:14px 16px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);width:100%}
.field textarea{min-height:90px;resize:vertical;font-size:16px}

.types{display:grid;gap:12px}
.type{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center;text-align:left;padding:14px;border:1px solid var(--line);border-radius:6px;background:#fff;min-height:96px}
.type svg{width:96px;height:68px;stroke:var(--ink);fill:none;stroke-width:1.6}
.type strong{display:block;font-size:19px;font-weight:600}
.type span{color:var(--muted);font-size:14px}
.type.on{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}

.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.seg button{min-height:56px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 10px;font-size:15px;line-height:1.25}
.seg button small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.seg button.on{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);font-weight:600}
.seg button:disabled{opacity:.38;cursor:not-allowed}
.mods{display:flex;flex-wrap:wrap;gap:6px}
.mods button{min-height:52px;min-width:64px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 10px;font-size:13px;line-height:1.2;text-align:left}
.mods button b{font-family:var(--mono);color:var(--muted);margin-right:4px}
.mods button small{display:block;font-family:var(--mono);color:var(--muted);font-size:12px}
.mods button.on{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.seg.sm{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.seg.sm button{min-height:46px;font-size:13.5px;padding:6px 8px}
.modbox{border-color:var(--accent)}
.sub{font-size:13px;color:var(--muted);font-weight:600;margin-top:4px}

.num{display:grid;grid-template-columns:64px 1fr 64px;gap:10px;align-items:center}
.num button{height:64px;border-radius:6px;border:1px solid var(--line);background:#fff;font-size:28px;line-height:1}
.num input{height:64px;width:100%;text-align:center;font-family:var(--mono);font-size:30px;font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
.numhead{display:flex;justify-content:space-between;align-items:baseline}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:6px;background:#fff;min-height:64px;text-align:left;width:100%}
.sw{width:58px;height:34px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle.on .sw{background:var(--accent)}
.toggle.on .sw::after{transform:translateX(24px)}

.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:12px 8px}
.swatch{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px;font-size:12px;line-height:1.25;text-align:center;color:var(--ink)}
.chip{width:52px;height:52px;border-radius:50%;border:1px solid rgba(0,0,0,.12);background-size:cover}
.swatch.on .chip{box-shadow:0 0 0 3px var(--panel),0 0 0 6px var(--accent)}
.swatch.on{font-weight:600}
.swatch b{display:block;font-family:var(--mono);font-size:12px;font-weight:500}
.swatch:disabled{opacity:.3;cursor:not-allowed}
.more{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.more button{min-height:44px;padding:0 16px;border:1px dashed var(--line);border-radius:999px;background:#fff;font-size:14px}
.more input{flex:1 1 160px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
.pop{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--brass);vertical-align:middle}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.check{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border:1px solid var(--line);border-radius:6px;background:#fff;text-align:left;font-size:15px;width:100%}
.check i{width:24px;height:24px;border-radius:5px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-style:normal;color:#fff;font-size:15px}
.check.on{border-color:var(--accent)}
.check.on i{background:var(--accent);border-color:var(--accent)}
.tier{display:grid;gap:8px}
.tier button{text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:6px;background:#fff;min-height:64px}
.tier button b{display:block;font-size:16px}
.tier button span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.tier button.on{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.hwinfo{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.5}
.hwinfo ul{margin:0;padding-left:18px}
.hwinfo dl{display:grid;grid-template-columns:1fr auto;gap:4px 14px;margin:0}
.hwinfo dd{margin:0;font-family:var(--mono);text-align:right}
.demo{min-height:48px;border:1px solid var(--accent);color:var(--accent);background:#fff;border-radius:999px;font-weight:600;padding:0 18px;align-self:flex-start}
.check small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.35}

/* cut list */
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card small{font-size:12px;color:var(--muted)}
.card b{font-family:var(--mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.card span{font-size:13px;color:var(--muted)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid #E3E5E1;vertical-align:top}
th{font-size:12px;letter-spacing:.04em;color:var(--muted);font-weight:600;background:#F1F2EF;position:sticky;top:0}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.grp td{background:#EEF1EC;font-weight:600;font-size:13px;color:var(--accent)}
.hw{display:grid;grid-template-columns:1fr auto;gap:6px 16px;margin:0;font-size:15px}
.hw dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.hw dt{color:var(--ink)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btnlink{flex:1 1 160px;min-height:56px;border-radius:6px;border:1px solid var(--line);background:#fff;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;color:var(--ink);text-decoration:none}
.actions button{flex:1 1 160px;min-height:56px;border-radius:6px;border:1px solid var(--line);background:#fff;font-size:16px;font-weight:600}
.actions .primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toast{font-size:14px;color:var(--accent);min-height:20px;margin:0}
.copybox{width:100%;min-height:160px;font-family:var(--mono);font-size:13px;border:1px solid var(--line);border-radius:6px;padding:10px}

.nav{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
.nav button{flex:1;min-height:60px;border-radius:6px;font-size:17px;font-weight:600;border:1px solid var(--line);background:#fff}
.nav .primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);flex:2}

/* projects drawer */
.sheet[hidden]{display:none}
.cutsheet{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px}
.cutsheet svg{width:100%;height:auto;display:block}
.cuthead{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.cuthead b{color:var(--ink);font-size:14px}
.cutgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.warn{background:#F6E7E2;color:var(--warn);border-radius:6px;padding:10px 12px;font-size:14px;margin:0}
.ai-btn[hidden]{display:none}
.quick[hidden]{display:none}
.quick{position:absolute;left:12px;right:12px;bottom:12px;max-height:58%;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:14px 16px;display:flex;flex-direction:column;gap:14px;z-index:5}
.quick-head{display:flex;align-items:center;gap:10px}
.quick-head h3{margin:0;font-family:var(--display);font-size:20px;flex:1}
.quick-head button{min-height:44px;min-width:44px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:15px;padding:0 14px}
.qsize{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;font-size:15px}
.qsize button{width:48px;height:48px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:22px}
.qsize output{font-family:var(--mono);min-width:72px;text-align:center;font-size:17px}
.quick{left:auto;right:12px;top:12px;bottom:12px;width:min(410px,48%);max-height:none}
.stage.qopen .views{right:calc(min(410px,48%) + 28px)}
.stage.qopen .dims{display:none}
@media (max-width:900px){
  .stage{position:sticky;top:0;z-index:6}
  .quick{position:fixed;left:0;right:0;top:auto;bottom:0;width:auto;max-height:50vh;border-radius:14px 14px 0 0;z-index:15;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .stage.qopen .views{right:16px}
  .stage.qopen .dims{display:block}
}
.tap-hint{position:absolute;left:50%;transform:translateX(-50%);bottom:76px;background:rgba(29,35,33,.78);color:#F4F6F2;font-size:13px;padding:6px 12px;border-radius:999px;pointer-events:none;white-space:nowrap}
.ai-btn{position:absolute;left:16px;top:16px;min-height:52px;padding:0 20px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.18);display:inline-flex;align-items:center;gap:8px}
.ai-box{position:absolute;left:16px;right:16px;top:80px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:14px;display:flex;flex-direction:column;gap:10px;max-height:60%;z-index:4}
.ai-box[hidden]{display:none}
.ai-log{overflow-y:auto;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.45}
.ai-log p{margin:0;padding:8px 12px;border-radius:8px;background:#fff;border:1px solid var(--line)}
.ai-log p.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ai-row{display:flex;gap:8px}
.ai-row input{flex:1;min-height:52px;padding:0 14px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:16px;background:#fff;color:var(--ink);min-width:0}
.ai-row button{min-height:52px;padding:0 18px;border:0;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.ai-hints{display:flex;gap:6px;flex-wrap:wrap}
.ai-hints button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;min-height:36px}

.photo[hidden]{display:none}
.photo{position:fixed;inset:0;background:rgba(29,35,33,.6);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.photo-in{width:min(1180px,100%);max-height:100%;overflow:auto;background:var(--panel);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px}
.photo-img{position:relative;border-radius:6px;overflow:hidden;background:#D9DBD6;aspect-ratio:3/2}
.photo-img img{width:100%;height:100%;object-fit:contain;display:block}
.photo-wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:12px;background:rgba(244,246,242,.72);font-size:16px;font-weight:600}
.photo-wait[hidden]{display:none}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sheet{position:fixed;inset:0;background:rgba(29,35,33,.45);display:flex;justify-content:flex-end;z-index:20}
.sheet-in{width:min(560px,100%);height:100%;background:var(--panel);display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(18px + env(safe-area-inset-bottom,0px));gap:14px}
.sheet-head{display:flex;align-items:center;gap:12px}
.sheet-head h2{flex:1}
.plist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-height:0}
.pitem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.pitem.cur{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.pitem .open{border:0;background:none;text-align:left;padding:4px 0;display:flex;flex-direction:column;gap:2px;min-width:0}
.pitem .open b{font-size:17px;font-weight:600}
.pitem .open span{font-size:13px;color:var(--muted)}
.pbtns{display:flex;gap:6px}
.pbtns button{min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:14px}
.pbtns button.danger{color:var(--warn)}
.pbtns button.confirm{background:var(--warn);color:#fff;border-color:var(--warn)}
.empty{color:var(--muted);text-align:center;padding:40px 10px;line-height:1.6}
.storage{font-size:13px;color:var(--muted)}

@media (prefers-reduced-motion:reduce){.sw,.sw::after{transition:none}}
@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto}
  main,main.wide{grid-template-columns:1fr}
  .stage{height:46vh;min-height:300px}
  .panel{min-height:auto}
  .content{overflow:visible}
}
@media (max-width:480px){
  .ghost span{display:none}
  .steps button{font-size:11px}
  .content{padding:18px 16px}
}
</style>

<div class="app">
  <header>
    <div class="brand">NOVORA</div>
    <div class="proj"><b id="pName">ახალი პროექტი</b><small id="pState">არ არის შენახული</small></div>
    <div class="hdr-actions">
      <button class="ghost" id="btnList" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>პროექტები</span></button>
      <button class="ghost" id="btnNew" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg><span>ახალი</span></button>
      <button class="ghost solid" id="btnSave" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg><span>შენახვა</span></button>
      <button class="ghost" id="btnFull" type="button" aria-label="სრული ეკრანი"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>

function renderHeader(){

}
function touch(){dirty=true;renderHeader();}
function change(){touch();normalize();build();render();}

function afterNum(k){if(k==='n'&&S.mods){delete S.mods.A;selMod=null;}if(k==='w'&&S.type!=='vanity'){if(S.type==='kitchen'&&S.mods&&S.mods.A)S.n=S.mods.A.length;else S.n=autoN(S);}}
function commitNum(k,v){
  const [mn,mx]=lim(k);v=Math.round(+v);if(!isFinite(v))v=S[k];
  S[k]=Math.min(mx,Math.max(mn,v));
  afterNum(k);
  change();
}

layout (სამზარეულოს ფორმა): I | L | U | II (ორრიგიანი, wf მოპირდაპირე რიგის სიგრძე 900-6000). ch ჭერის სიმაღლე 2200-3600. walls: 1-4 კედელი. rw ოთახის სიგანე 1500-8000, rd ოთახის სიღრმე 1500-8000, wl მარცხენა კედელზე ავეჯის სიგრძე 900-4000, wr მარჯვენა 900-4000. upper, mirror, lift, soft: true/false. material: ${MATERIALS.map(m=>m.id+'='+m.n).join(', ')}. style: flat | shaker (მხოლოდ paint) | gola. handle: bar | knob. hcolor: black | steel | brass. top: quartz | concrete | granite | oak. hw: eco | std | prem.
svc (სია): ${SERVICES.map(v=>v.id+'='+v.n).join(', ')}.
სიმაღლეები მმ: plinth 60-200 (ცოკოლი), bh 500-900 (ქვედა კორპუსი), tt 12-80 (ზედაპირის სისქე), ub 1200-1900 (ზედა კარადის ქვედა წიბო იატაკიდან), uh 300-1200 (ზედა კარადის სიმაღლე), th 1800-2800 (მაღალი კარადა), taph 150-500 (ონკანი), pendh 1200-2600 (სანათი), pend 0-3 (სანათების რაოდენობა).
sink: ${SINKS.map(x=>x.id+'='+x.n).join(', ')}. sinkc: ${SINKC.map(x=>x.id+'='+x.n).join(', ')}. tap: ${TAPS.map(x=>x.id+'='+x.n).join(', ')}. hob: ${HOBS.map(x=>x.id+'='+x.n).join(', ')}. hood: ${HOODS.map(x=>x.id+'='+x.n).join(', ')}. ledc: ${LEDC.map(x=>x.id+'='+x.n).join(', ')}.
split (true = ზედა ფასადი ცალკე ფერში frontU-თი). ef 2|1|0.8 ფასადის კრომკა, eb 0.4|0.8|2 კორპუსის კრომკა, efc/ebc: ${EDGEC.map(x=>x.id+'='+x.n).join(', ')}. ral (ტექსტი), gloss: matt|semi|gloss (მხოლოდ paint). style ასევე fluted (ზოლები, paint), handle ასევე routed (ამოფრეზილი, paint).
xlOn/xrOn true = დამატებითი მოდულები მარცხენა/მარჯვენა კედელზე, xl/xr სიგრძე 300-4000, xlo/xro დაშორება უკანა კედლიდან.
mods: მოდულების შეცვლა {"A":[{"t":"doors","w":600,"u":""},...]} (A მთავარი, B მარცხენა, C მარჯვენა, D მოპირდაპირე; ჯამი = კედლის სიგრძე). t: ${MODT.map(x=>x.id+'='+x.n).join(', ')}. u (ზემოთ): ""=ავტომატური, ${UPT.map(x=>x.id+'='+x.n).join(', ')}.
front ფერები ამ მასალისთვის (id=კოდი სახელი): ${colorsFor(S.material).map(c=>c.id+'='+cName(c)).join('; ')}
თუ მასალას ცვლი, front აირჩიე ახალი მასალის სიიდან: ${MATERIALS.map(m=>m.id+': '+colorsFor(m.id).slice(0,40).map(c=>c.id+'='+cName(c)).join(', ')).join(' | ')}
body (კორპუსი, მხოლოდ LAM): ${colorsFor('lam').map(c=>c.id+'='+cName(c)).join('; ')}
ოსტატის მოთხოვნა: «${q}»
უპასუხე მხოლოდ JSON-ით: {"set":{...შესაცვლელი ველები, ან {}},"reply":"მოკლე პასუხი ქართულად, რა შეიცვალა ან პასუხი კითხვაზე"}`;
  try{
    const out=await sampler.json(prompt,{modelTier:'quick',cache:false});
    const ch=(out&&out.set)||{};const allowed=['mods','plinth','bh','tt','ub','uh','th','sink','sinkc','tap','taph','hob','hood','ledc','pend','pendh','split','frontU','ef','eb','efc','ebc','ral','gloss','xlOn','xl','xlo','xrOn','xr','xro','layout','walls','rw','rd','wl','wr','wf','ch','type','w','h','d','n','upper','mirror','lift','material','style','handle','hcolor','front','body','top','hw','soft','svc'];
    if(ch.type&&TYPES[ch.type]&&ch.type!==S.type){S.type=ch.type;Object.assign(S,TYPES[ch.type].def);S.n=autoN(S);}
    for(const k of allowed){if(!(k in ch)||k==='type')continue;const v=ch[k];
      if(k==='layout'){if(['I','L','U','II'].includes(v))S.layout=v;}
      else if(k==='walls')S.walls=+v;
      else if(k==='mods'){if(v&&typeof v==='object'&&!Array.isArray(v))S.mods=Object.assign({},S.mods,v);}
      else if(['pend','ef','eb'].includes(k))S[k]=String(v);
      else if(['split','xlOn','xrOn'].includes(k))S[k]=!!v;
      else if(['w','h','d','n','rw','rd','wl','wr','wf','ch',...KNUM].includes(k)){const l=lim(k);if(!l)continue;S[k]=Math.min(l[1],Math.max(l[0],Math.round(+v)||S[k]));}
      else if(['upper','mirror','lift','soft'].includes(k))S[k]=!!v;
      else if(k==='svc'&&Array.isArray(v))S.svc=v.filter(x=>SERVICES.some(sv=>sv.id===x));
      else if(typeof v==='string')S[k]=v;}
    if('w' in ch&&!('n' in ch)&&S.type!=='vanity')S.n=autoN(S);
    if(!MATERIALS.some(m=>m.id===S.material))S.material='lam';if(!STYLES.some(x=>x.id===S.style))S.style='flat';
    if(!HANDLES.some(x=>x.id===S.handle))S.handle='bar';if(!HCOLORS.some(x=>x.id===S.hcolor))S.hcolor='black';if(!TOPS.some(x=>x.id===S.top))S.top='quartz';
    normalize();
    wait.textContent=(out&&out.reply)||'შევცვალე.';
    if(Object.keys(ch).length)change();
  }catch(e){wait.textContent=e&&e.code==='not_granted'?'AI ასისტენტი გამორთულია. ჩართვა შეგიძლია გვერდის ნებართვებიდან.':e&&e.code==='rate_limited'?'ცოტა მოიცადე და ისევ სცადე.':'ვერ შევასრულე. სცადე სხვა სიტყვებით.';}
  finally{aiBusy=false;}
}
window.NOVORA={get:()=>JSON.parse(JSON.stringify(S)),load:st=>{S=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),st);normalize();curId=null;dirty=true;setView('angle');build();render();fitCamera(false);}};
normalize();S.n=autoN(S);
build();render();fitCamera(true);requestAnimationFrame(loop);
})();
